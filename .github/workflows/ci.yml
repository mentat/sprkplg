name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # The newest released Xcode 26 on the runner (betas are skipped).
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -1)/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: make test
